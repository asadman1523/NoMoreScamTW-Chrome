<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      width: 100%;
      min-width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
      font-size: 16px;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
      color: #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status {
      margin: 20px 0;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
    }

    button:hover {
      background-color: #1976D2;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 15px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="mainView">
    <h1>
      <img src="icons/icon48.png" width="24" height="24">
      <span id="appName">NoMoreScamTW</span> <span id="version"
        style="font-size: 10px; color: #999; margin-left: 5px;"></span>
    </h1>

    <div class="status" id="status">
      &nbsp;<br>
      &nbsp;<br>
      &nbsp;<br>
      &nbsp;
    </div>

    <!-- Premium / Usage Section -->
    <div class="premium-section"
      style="margin: 20px 0; padding: 15px; background: #fff3e0; border-radius: 8px; border: 1px solid #ffe0b2;">
      <div
        style="font-weight: 600; color: #e65100; margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between;">
        <span id="planLabel">💎 版本: 免費版</span>
        <span id="expiryLabel" style="font-size: 12px; color: #666; font-weight: normal;"></span>
      </div>

      <!-- Usage Stats -->
      <div id="usageStats" style="font-size: 13px; color: #333; margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span>網頁掃描:</span>
          <span id="webUsage">0 / 20</span>
        </div>
        <div style="background: #e0e0e0; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 8px;">
          <div id="webProgress" style="width: 0%; background: #fb8c00; height: 100%;"></div>
        </div>

        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span>Email 掃描:</span>
          <span id="emailUsage">0 / 10</span>
        </div>
        <div style="background: #e0e0e0; height: 6px; border-radius: 3px; overflow: hidden;">
          <div id="emailProgress" style="width: 0%; background: #fb8c00; height: 100%;"></div>
        </div>
      </div>


      <!-- Activation Input (Hidden if Premium) -->
      <div id="activationArea" style="margin-top: 12px; border-top: 1px dashed #ccc; padding-top: 10px;">
        <div style="font-size: 12px; color: #555; margin-bottom: 5px;">輸入序號啟用進階版 (365天無限掃描)</div>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="licenseInput" placeholder="VIP-xxxx"
            style="flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px;">
          <button id="activateBtn"
            style="width: auto; padding: 6px 12px; background: #ef6c00; font-size: 12px;">啟用</button>
        </div>
        <div id="activationMsg" style="font-size: 11px; margin-top: 4px; color: #d32f2f;"></div>
        <div style="margin-top: 10px; text-align: center;">
          <a href="#" id="buyBtn" style="color: #1976D2; font-size: 12px; text-decoration: none;">還沒有序號？點此前往購買 (早鳥 NT$ 99/年)
            ➜</a>
        </div>
      </div>
    </div>

    <!-- Report Scam Button -->
    <button id="reportScamBtn" style="margin-bottom: 10px; background-color: #d32f2f;">🚨 回報此網站詐騙</button>
    <div id="reportStatus" style="font-size: 13px; margin-bottom: 15px; color: #555; text-align: center; display: none;"></div>

    <!-- Whitelist Button -->
    <button id="manageWhitelistBtn" style="margin-top: 0px; background-color: #607d8b;">⚙️ 管理白名單</button>

    <!-- FB Group Button -->
    <button id="fbGroupBtn" style="margin-top: 10px; background-color: #4267B2;">Facebook問題回報社團</button>
  </div>

  <!-- Whitelist View -->
  <div id="whitelistView" style="display: none;">
    <div style="display: flex; align-items: center; margin-bottom: 15px;">
      <button id="backToMainBtn"
        style="width: auto; padding: 6px 10px; margin-right: 10px; background: #eee; color: #333;">⬅️</button>
      <h2 style="margin: 0; font-size: 18px; color: #333;">白名單管理</h2>
    </div>

    <div style="margin-bottom: 10px; display: flex; gap: 15px;">
      <label style="display: flex; align-items: center; cursor: pointer;">
        <input type="radio" name="whitelistType" value="email" checked>
        <span style="margin-left: 5px;">Email</span>
      </label>
      <label style="display: flex; align-items: center; cursor: pointer;">
        <input type="radio" name="whitelistType" value="domain">
        <span style="margin-left: 5px;">網站網域</span>
      </label>
    </div>

    <div style="margin-bottom: 15px; display: flex; gap: 8px;">
      <input type="text" id="whitelistInput" placeholder="輸入 Email (例如: user@example.com)"
        style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
      <button id="addWhitelistBtn" style="width: auto; background-color: #4caf50; padding: 0 15px;">新增</button>
    </div>

    <div id="whitelistLimitMsg" style="font-size: 12px; color: #666; margin-bottom: 10px; text-align: right;"></div>

    <ul id="whitelistContainer"
      style="list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; border-top: 1px solid #eee;">
      <!-- Items will be injected here -->
    </ul>

    <div style="margin-top: 15px; font-size: 12px; color: #999; text-align: center;">
      (付費版可自動同步至雲端)
    </div>
  </div>

  <!-- Manual Query Section Removed -->

  <!-- Footer Removed -->

  <script src="firebase_config.js"></script>
  <script src="popup.js"></script>
</body>

</html>
